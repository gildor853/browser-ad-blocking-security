name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner image pinned explicitly so an image switch is a deliberate change.
# Only GitHub-owned actions are used (the repository allows nothing else).

jobs:
  checks:
    name: Documentation checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check:legal
      - run: npm run check:sources
      - run: npm run check:links
